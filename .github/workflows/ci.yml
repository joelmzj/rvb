name: CI

on:
  schedule:
    schedule:
  - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  check_patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 60
    services:
      cf_solver:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python dependencies
        run: pip install --no-cache-dir curl_cffi || true

      - name: Fetch configs & state (data branch)
        run: bash .github/scripts/fetch_data_branch.sh

      - name: Sync Patch Sources
        id: sync_patch_sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: python3 .github/scripts/sync_patch_sources.py

      - name: Fetch App Versions
        id: fetch_app_versions
        env:
          CF_SOLVER_URL: "http://localhost:8000"
        run: bash .github/scripts/ci_fetch_app_versions.sh

      - name: Compare App Versions
        id: compare_apps
        run: bash .github/scripts/ci_compare_app_versions.sh

      - name: Classify triggers
        id: flags
        env:
          TRIGGER_STABLE: ${{ steps.sync_patch_sources.outputs.TRIGGER_STABLE || '0' }}
          TRIGGER_BETA: ${{ steps.sync_patch_sources.outputs.TRIGGER_BETA || '0' }}
          TRIGGER_BLOCKED: ${{ steps.sync_patch_sources.outputs.TRIGGER_BLOCKED || '0' }}
          TRIGGER_APP_UPDATE: ${{ steps.compare_apps.outputs.TRIGGER_APP_UPDATE || '0' }}
        run: bash .github/scripts/ci_trigger_flags.sh

      - name: Commit updated patch sources and configs
        if: ${{ steps.flags.outputs.ANYTHING_CHANGED == '1' }}
        run: bash .github/scripts/commit_data_branch.sh

  build_manual:
    needs: check_patch
    uses: ./.github/workflows/build.yml
    with:
      config_file: "configs/config.manual.toml"
    secrets: inherit

  trigger_cleanup:
    needs: build_manual
    if: ${{ always() && needs.build_manual.result == 'success' }}
    uses: ./.github/workflows/cleanup.yml
    secrets: inherit

  trigger_notify_failure:
    needs: [check_patch, build_manual]
    if: ${{ failure() }}
    uses: ./.github/workflows/notify.yml
    with:
      workflow_name: "CI"
      already_reported: ${{ needs.build_manual.outputs.reported_failures == 'true' }}
    secrets: inherit
