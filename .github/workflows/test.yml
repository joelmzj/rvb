name: Quick Check Dev Flag
on: workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Patches Version Config
        run: |
          echo "Comprobando la configuración de ramas dev:"
          grep -E "patches-source|patches-version" configs/config.manual.toml
